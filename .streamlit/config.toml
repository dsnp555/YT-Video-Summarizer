[theme]
# switch to built-in dark base
base = "dark"

# accent + colors for dark theme (tweak if you like)
primaryColor = "#1DB954"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
